name: Temporary preview transfer
on:
  push:
    branches: [minis-bootstrap-5208daf]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import exact commit and fast-forward test
        shell: bash
        run: |
          echo "" | base64 -d > /tmp/preview.bundle
          git fetch /tmp/preview.bundle refs/heads/test:refs/heads/local-preview
          test "$(git rev-parse local-preview)" = 5208daf8eeb478168fbfb22fb9d702765209fa1d
          test "$(git ls-remote origin refs/heads/test | cut -f1)" = 4807506293b863cb0cb3887a1e491e6827aae34f
          git push origin local-preview:refs/heads/test
